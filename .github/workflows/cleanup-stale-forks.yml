name: Clean up stale forks

on:
  schedule:
    - cron: "30 7 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print keep and delete decisions without deleting forks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-stale-forks
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require FORK_CLEANUP_TOKEN
        env:
          FORK_CLEANUP_TOKEN: ${{ secrets.FORK_CLEANUP_TOKEN }}
        run: |
          if [ -z "${FORK_CLEANUP_TOKEN}" ]; then
            echo "FORK_CLEANUP_TOKEN is required"
            exit 1
          fi

      - name: Clean up stale forks
        env:
          FORK_CLEANUP_TOKEN: ${{ secrets.FORK_CLEANUP_TOKEN }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || inputs.dry_run }}
        run: python3 .github/scripts/cleanup_stale_forks.py
